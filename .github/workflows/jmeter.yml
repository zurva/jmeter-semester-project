name: JMeter Performance Tests

on:
  push:
    branches: [ main ]  # Trigger this workflow on any push to the 'main' branch

jobs:
  performance-test:
    runs-on: ubuntu-latest  # Runs on the latest version of Ubuntu

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up Java 11
    - name: Set up Java 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    # Step 3: Download Apache JMeter
    - name: Download Apache JMeter
      run: |
        wget -q https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz  # Download JMeter
        tar -xzf apache-jmeter-5.6.3.tgz && mv apache-jmeter-5.6.3 jmeter  # Unpack JMeter

    # Step 4: Run the JMeter performance tests
    - name: Run Performance Tests
      run: |
        mkdir -p results reports  # Create directories for storing results and reports
        jmeter/bin/jmeter -n \  # Run JMeter in non-GUI mode
          -t tests/load_test.jmx \  # Path to your JMeter test plan file
          -l results/results.jtl \  # Location for the raw results file
          -e -o reports/  # Generate HTML report in 'reports' folder

    # Step 5: Upload the HTML Report as a GitHub Artifact
    - name: Upload HTML Report as Artifact
      uses: actions/upload-artifact@v3
      if: always()  # Always upload the artifact, even if the test fails
      with:
        name: jmeter-report  # Name of the artifact
        path: reports/  # Path to the generated reports folder
