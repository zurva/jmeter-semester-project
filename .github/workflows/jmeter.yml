name: JMeter Performance Tests

on:
  push:
    branches: [ main ]

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Java 11
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3️⃣ Download Apache JMeter
      - name: Download Apache JMeter
        run: |
          wget -q https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      # 4️⃣ Run JMeter test in non-GUI mode
      - name: Run Performance Tests
        run: |
          mkdir -p results reports
          jmeter/bin/jmeter -n -t tests/load_test.jmx -l results/results.jtl -e -o reports/

      # 5️⃣ Ensure reports folder exists
      - name: List reports folder
        run: |
          ls -R reports/

      # 6️⃣ Upload HTML report as artifact (v4)
      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-html-report
          path: reports/